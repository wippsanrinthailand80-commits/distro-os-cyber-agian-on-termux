# PhantomSec OS — Configuration
# ─────────────────────────────────────────────────────────────────
VERSION="1.0.0"
AUTHOR="PhantomSec Project"

# Directories
PHANTOMSEC_DIR="$HOME/.phantomsec"
LOG_DIR="$HOME/.phantomsec/logs"
REPORTS_DIR="$HOME/.phantomsec/reports"
WORDLISTS_DIR="$HOME/.phantomsec/wordlists"

# API Keys (fill in your own)
SHODAN_API_KEY=""
CENSYS_API_ID=""
CENSYS_API_SECRET=""
VIRUSTOTAL_API_KEY=""

# Network
DEFAULT_THREADS=4
DEFAULT_TIMEOUT=10
USER_AGENT="Mozilla/5.0 (Linux; Android 12; Termux) PhantomSec/1.0"

# Display
THEME="phantom"        # phantom | dark | matrix | classic
BANNER_STYLE="full"    # full | mini | none
SHOW_IP_ON_START=true
SHOW_SYSINFO=true

# Logging
LOG_LEVEL="info"       # debug | info | warn | error
LOG_ENABLED=true
LOG_MAX_FILES=50
